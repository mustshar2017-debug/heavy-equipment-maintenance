name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install
      - name: Prepare offline web assets
        run: npm run build:web
      - name: Generate Android project
        run: npx cap add android
      - name: Apply official Android launcher icon
        run: |
          python3 -m pip install --user Pillow
          python3 scripts/install-android-icons.py
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --max-workers=2; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build failed; retrying after a short wait (attempt $attempt/3)."
              sleep $((attempt * 20))
            fi
          done
          exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wad-kenana-maintenance-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
